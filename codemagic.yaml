# Signed iOS builds to TestFlight via Codemagic (https://codemagic.io).
# One-time setup in Codemagic:
#   1. Add this GitHub repo as an app.
#   2. Teams > Integrations > Developer Portal: add an App Store Connect API key
#      and name it "QuranWords300ASC" (or change the name below).
#   3. Create the app in App Store Connect with bundle ID com.easyquran.words.
# Then start the "ios-testflight" workflow.
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: ios-app
    integrations:
      app_store_connect: QuranWords300ASC
    environment:
      flutter: 3.47.9
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.easyquran.words
    scripts:
      - name: Packages
        script: flutter pub get
      - name: Tests
        script: flutter test
      - name: Signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          # Codemagic's BUILD_NUMBER increases every run; offset past Android's 5.
          flutter build ipa --release --build-number=$((BUILD_NUMBER + 5)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - '**/build/ios/ipa/*.ipa'
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
